<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALint</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
  }

  body {
    background-color: #e0e0e0;
    color: #000;
    margin: 0;
    padding: 10px;
  }

  h1, h2, h3, .pixel-text {
    font-family: 'VT323', monospace;
    font-size: 22px;
    margin: 0;
    letter-spacing: 1px;
  }

  .pixel-title {
    font-family: 'VT323', monospace;
    font-size: 36px;
    color: #000080;
    text-transform: uppercase;
  }

  #container {
    width: 960px;
    margin: 0 auto;
    background: #c0c0c0;
    border: 3px solid #000;
    padding: 10px;
  }

  header {
    background: #000080;
    color: #fff;
    padding: 6px 10px;
    border: 2px solid #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  header h1 {
    color: #fff;
    font-size: 32px;
  }

  .auth-panel {
    background: #ffffcc;
    border: 2px solid #000;
    padding: 6px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 3px 8px;
    font-weight: bold;
    cursor: pointer;
    color: #000;
    text-decoration: none;
    display: inline-block;
  }

  .btn:active {
    border-color: #808080 #fff #fff #808080;
  }

  .auth-input {
    width: 110px !important;
    margin-bottom: 0 !important;
    padding: 2px !important;
  }

  .layout {
    display: flex;
    gap: 10px;
  }

  .sidebar {
    width: 240px;
    background: #d4d0c8;
    border: 2px solid #000;
    padding: 8px;
  }

  .main-content {
    flex: 1;
    background: #fff;
    border: 2px solid #000;
    padding: 10px;
  }

  .box {
    border: 2px solid #000;
    background: #d4d0c8;
    padding: 6px;
    margin-bottom: 10px;
  }

  .box-title {
    background: #808080;
    color: #fff;
    padding: 2px 5px;
    font-weight: bold;
    margin: -6px -6px 6px -6px;
    border-bottom: 2px solid #000;
  }

  input[type="text"], input[type="password"], select {
    width: 100%;
    border: 2px solid #000;
    padding: 3px;
    background: #fff;
    margin-bottom: 6px;
  }

  .video-player-container {
    background: #000;
    border: 2px solid #000;
    width: 100%;
    height: 360px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #808080;
    font-family: 'VT323', monospace;
    font-size: 24px;
  }

  video {
    width: 100%;
    height: 100%;
    background: #000;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .video-card {
    border: 2px solid #000;
    background: #e0e0e0;
    padding: 6px;
    cursor: pointer;
  }

  .video-card:hover {
    background: #ffffcc;
  }

  .video-thumb {
    width: 100%;
    height: 100px;
    background: #808080;
    border: 1px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'VT323', monospace;
    font-size: 18px;
  }

  .meta {
    font-size: 11px;
    color: #404040;
    margin-top: 4px;
  }

  .no-videos-message {
    grid-column: span 2;
    background: #ffffcc;
    border: 2px dashed #000;
    padding: 16px;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 20px;
  }

  .status-bar {
    background: #c0c0c0;
    border: 2px solid #000;
    padding: 3px 6px;
    margin-top: 10px;
    font-size: 11px;
  }
</style>
</head>
<body>

<div id="container">
  <header>
    <div class="pixel-title">REALint</div>
    <div class="auth-panel" id="auth-panel">
      <input type="text" id="login-email" class="auth-input" placeholder="EMAIL">
      <input type="password" id="login-pass" class="auth-input" placeholder="PASS">
      <button class="btn" onclick="accountAction('LOGIN')">LOGIN</button>
      <button class="btn" onclick="accountAction('REGISTER')">REGISTER</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="box">
        <div class="box-title">USER STATUS</div>
        <div id="user-info">NOT LOGGED IN</div>
      </div>

      <div class="box">
        <div class="box-title">SEARCH & FILTER</div>
        <label>Title:</label>
        <input type="text" id="search-input" oninput="applyFilters()">
        
        <label>Category:</label>
        <select id="category-select" onchange="applyFilters()">
          <option value="ALL">ALL CATEGORIES</option>
          <option value="Gaming">Gaming</option>
          <option value="Tech">Tech</option>
          <option value="Animation">Animation</option>
          <option value="Music">Music</option>
        </select>

        <label>Sort By:</label>
        <select id="sort-select" onchange="applyFilters()">
          <option value="TRENDING">Trending (Likes/Time)</option>
          <option value="NEWEST">Newest Uploads</option>
        </select>
      </div>

      <div class="box">
        <div class="box-title">UPLOAD VIDEO</div>
        <label>Title:</label>
        <input type="text" id="upload-title">
        
        <label>Category:</label>
        <select id="upload-category">
          <option value="Gaming">Gaming</option>
          <option value="Tech">Tech</option>
          <option value="Animation">Animation</option>
          <option value="Music">Music</option>
        </select>

        <label>Video File (MP4/WebM):</label>
        <input type="file" id="upload-file" accept="video/mp4,video/webm">
        
        <button class="btn" style="width:100%; margin-top:6px;" onclick="uploadVideo()">UPLOAD</button>
      </div>
    </div>

    <div class="main-content">
      <div class="box">
        <div class="box-title" id="current-video-title">PLAYER: NO MEDIA LOADED</div>
        <div class="video-player-container" id="player-container">
          <span id="player-placeholder">NO VIDEOS FOUND</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span id="player-category" class="btn" style="font-size:10px;">CAT: NONE</span>
            <span id="player-author" style="margin-left:8px;">By: N/A</span>
          </div>
          <div>
            <button class="btn" onclick="likeCurrentVideo()">LIKE (<span id="player-likes">0</span>)</button>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="box-title">VIDEO INDEX</div>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">STATUS: LOCAL DATABASE READY. NO AWS KEYS NEEDED.</div>
</div>

<script>
  let currentUser = null;
  let activeVideo = null;
  let videoDatabase = [];
  let userDatabase = {};

  window.onload = function() {
    loadLocalAccounts();
    loadLocalVideos();
  };

  function loadLocalAccounts() {
    const savedUsers = localStorage.getItem('realint_users');
    if (savedUsers) {
      userDatabase = JSON.parse(savedUsers);
    }
  }

  function accountAction(type) {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pass = document.getElementById('login-pass').value.trim();

    if (!email || !pass) {
      alert("PROVIDE BOTH EMAIL AND PASSWORD.");
      return;
    }

    if (type === 'REGISTER') {
      if (userDatabase[email]) {
        alert("ACCOUNT EXISTS. CLICK LOGIN.");
        return;
      }
      userDatabase[email] = pass;
      localStorage.setItem('realint_users', JSON.stringify(userDatabase));
      currentUser = email;
      updateUserUI();
      updateStatus("REGISTERED & LOGGED IN AS " + email.toUpperCase());
    } else if (type === 'LOGIN') {
      if (!userDatabase[email] || userDatabase[email] !== pass) {
        alert("INVALID EMAIL OR PASSWORD.");
        return;
      }
      currentUser = email;
      updateUserUI();
      updateStatus("LOGGED IN AS " + email.toUpperCase());
    }
  }

  function updateUserUI() {
    document.getElementById('user-info').innerText = currentUser.toUpperCase();
    document.getElementById('auth-panel').innerHTML = `<button class="btn" onclick="logout()">LOGOUT (${currentUser.toUpperCase()})</button>`;
  }

  function logout() {
    currentUser = null;
    window.location.reload();
  }

  function loadLocalVideos() {
    const savedVids = localStorage.getItem('realint_videos');
    if (savedVids) {
      videoDatabase = JSON.parse(savedVids);
      updateStatus("LOADED " + videoDatabase.length + " VIDEOS FROM STORAGE.");
    } else {
      videoDatabase = [];
      updateStatus("NO VIDEOS IN STORAGE.");
    }
    applyFilters();
  }

  function uploadVideo() {
    if (!currentUser) {
      alert("MUST LOGIN OR REGISTER TO UPLOAD.");
      return;
    }

    const titleInput = document.getElementById('upload-title').value.trim();
    const categoryInput = document.getElementById('upload-category').value;
    const fileInput = document.getElementById('upload-file');
    const file = fileInput.files[0];

    if (!titleInput || !file) {
      alert("PROVIDE TITLE AND FILE.");
      return;
    }

    const reader = new FileReader();
    updateStatus("PROCESSING VIDEO FILE...");

    reader.onload = function(e) {
      const videoRecord = {
        id: "vid_" + Date.now(),
        title: titleInput,
        category: categoryInput,
        video_url: e.target.result,
        mime_type: file.type,
        author: currentUser,
        likes: 0,
        liked_by: [],
        timestamp: Date.now()
      };

      videoDatabase.unshift(videoRecord);
      try {
        localStorage.setItem('realint_videos', JSON.stringify(videoDatabase));
        updateStatus("SUCCESSFULLY PUBLISHED VIDEO.");
        applyFilters();
      } catch(err) {
        alert("FILE TOO LARGE FOR LOCAL STORAGE. USE A SMALL MP4/WEBM FILE.");
        updateStatus("STORAGE LIMIT EXCEEDED.");
        videoDatabase.shift();
      }
    };

    reader.readAsDataURL(file);
  }

  function applyFilters() {
    const searchVal = document.getElementById('search-input').value.toLowerCase();
    const catVal = document.getElementById('category-select').value;
    const sortVal = document.getElementById('sort-select').value;

    let filtered = videoDatabase.filter(v => {
      const matchSearch = v.title.toLowerCase().includes(searchVal);
      const matchCat = (catVal === 'ALL') || (v.category === catVal);
      return matchSearch && matchCat;
    });

    if (sortVal === 'TRENDING') {
      filtered.sort((a, b) => {
        const ageA = (Date.now() - a.timestamp) / 3600000 + 2;
        const ageB = (Date.now() - b.timestamp) / 3600000 + 2;
        const scoreA = a.likes / Math.pow(ageA, 1.5);
        const scoreB = b.likes / Math.pow(ageB, 1.5);
        return scoreB - scoreA;
      });
    } else if (sortVal === 'NEWEST') {
      filtered.sort((a, b) => b.timestamp - a.timestamp);
    }

    renderGrid(filtered);

    if (filtered.length > 0) {
      if (!activeVideo || !filtered.some(v => v.id === activeVideo.id)) {
        loadVideoIntoPlayer(filtered[0]);
      }
    } else {
      resetPlayer();
    }
  }

  function renderGrid(videos) {
    const grid = document.getElementById('video-grid');
    grid.innerHTML = '';

    if (videos.length === 0) {
      grid.innerHTML = `<div class="no-videos-message">NO VIDEOS FOUND IN DATABASE</div>`;
      return;
    }

    videos.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => loadVideoIntoPlayer(v);

      card.innerHTML = `
        <div class="video-thumb">${v.category.toUpperCase()}</div>
        <div style="font-weight:bold; margin-top:4px;">${v.title}</div>
        <div class="meta">By: ${v.author}</div>
        <div class="meta">Likes: ${v.likes} | ${new Date(v.timestamp).toLocaleDateString()}</div>
      `;
      grid.appendChild(card);
    });
  }

  function loadVideoIntoPlayer(video) {
    activeVideo = video;
    document.getElementById('current-video-title').innerText = "PLAYER: " + video.title.toUpperCase();
    document.getElementById('player-category').innerText = "CAT: " + video.category.toUpperCase();
    document.getElementById('player-author').innerText = "By: " + video.author;
    document.getElementById('player-likes').innerText = video.likes;

    const container = document.getElementById('player-container');
    container.innerHTML = `<video id="main-player" controls preload="metadata"><source src="${video.video_url}" type="${video.mime_type || 'video/mp4'}">Your browser does not support HTML5 video.</video>`;

    updateStatus("LOADED VIDEO: " + video.title);
  }

  function resetPlayer() {
    activeVideo = null;
    document.getElementById('current-video-title').innerText = "PLAYER: NO MEDIA LOADED";
    document.getElementById('player-category').innerText = "CAT: NONE";
    document.getElementById('player-author').innerText = "By: N/A";
    document.getElementById('player-likes').innerText = "0";

    const container = document.getElementById('player-container');
    container.innerHTML = `<span id="player-placeholder">NO VIDEOS FOUND</span>`;
  }

  function likeCurrentVideo() {
    if (!activeVideo) return;
    if (!currentUser) {
      alert("MUST BE LOGGED IN TO LIKE.");
      return;
    }

    if (!activeVideo.liked_by) activeVideo.liked_by = [];
    
    if (activeVideo.liked_by.includes(currentUser)) {
      alert("YOU ALREADY LIKED THIS VIDEO.");
      return;
    }

    activeVideo.likes += 1;
    activeVideo.liked_by.push(currentUser);
    document.getElementById('player-likes').innerText = activeVideo.likes;

    localStorage.setItem('realint_videos', JSON.stringify(videoDatabase));
    updateStatus("LIKE REGISTERED FOR " + currentUser.toUpperCase());
    applyFilters();
  }

  function updateStatus(msg) {
    document.getElementById('status-bar').innerText = "STATUS: " + msg;
  }
</script>
</body>
</html>
