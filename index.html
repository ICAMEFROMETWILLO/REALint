<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALint - Global Cloud Stream</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
  }

  body {
    background-color: #e0e0e0;
    color: #000;
    margin: 0;
    padding: 10px;
  }

  h1, h2, h3, .pixel-text {
    font-family: 'VT323', monospace;
    font-size: 22px;
    margin: 0;
    letter-spacing: 1px;
  }

  .pixel-title {
    font-family: 'VT323', monospace;
    font-size: 36px;
    color: #000080;
    text-transform: uppercase;
    cursor: pointer;
  }

  #container {
    width: 960px;
    margin: 0 auto;
    background: #c0c0c0;
    border: 3px solid #000;
    padding: 10px;
  }

  header {
    background: #000080;
    color: #fff;
    padding: 6px 10px;
    border: 2px solid #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .auth-panel {
    background: #ffffcc;
    border: 2px solid #000;
    padding: 6px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 3px 8px;
    font-weight: bold;
    cursor: pointer;
    color: #000;
    text-decoration: none;
    display: inline-block;
  }

  .btn:active {
    border-color: #808080 #fff #fff #808080;
  }

  .auth-input {
    width: 110px !important;
    margin-bottom: 0 !important;
    padding: 2px !important;
  }

  .layout {
    display: flex;
    gap: 10px;
  }

  .sidebar {
    width: 240px;
    background: #d4d0c8;
    border: 2px solid #000;
    padding: 8px;
  }

  .main-content {
    flex: 1;
    background: #fff;
    border: 2px solid #000;
    padding: 10px;
  }

  .box {
    border: 2px solid #000;
    background: #d4d0c8;
    padding: 6px;
    margin-bottom: 10px;
  }

  .box-title {
    background: #808080;
    color: #fff;
    padding: 2px 5px;
    font-weight: bold;
    margin: -6px -6px 6px -6px;
    border-bottom: 2px solid #000;
  }

  input[type="text"], input[type="password"], select {
    width: 100%;
    border: 2px solid #000;
    padding: 3px;
    background: #fff;
    margin-bottom: 6px;
  }

  .video-player-container {
    background: #000;
    border: 2px solid #000;
    width: 100%;
    height: 360px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #808080;
    font-family: 'VT323', monospace;
    font-size: 24px;
  }

  video {
    width: 100%;
    height: 100%;
    background: #000;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .video-card {
    border: 2px solid #000;
    background: #e0e0e0;
    padding: 6px;
    cursor: pointer;
  }

  .video-card:hover {
    background: #ffffcc;
  }

  .video-thumb {
    width: 100%;
    height: 100px;
    background: #808080;
    border: 1px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'VT323', monospace;
    font-size: 18px;
  }

  .meta {
    font-size: 11px;
    color: #404040;
    margin-top: 4px;
  }

  .no-videos-message {
    grid-column: span 2;
    background: #ffffcc;
    border: 2px dashed #000;
    padding: 16px;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 20px;
  }

  .channel-banner {
    background: #e0e0e0;
    border: 2px solid #000;
    padding: 6px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .share-link {
    font-size: 10px;
    word-break: break-all;
    background: #fff;
    border: 1px solid #000;
    padding: 2px 4px;
    margin-top: 4px;
  }

  .status-bar {
    background: #c0c0c0;
    border: 2px solid #000;
    padding: 3px 6px;
    margin-top: 10px;
    font-size: 11px;
  }
</style>
<!-- Supabase SDK for Real Cloud Database and Global Video Storage -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="container">
  <header>
    <div class="pixel-title" onclick="goHome()">REALint</div>
    <div class="auth-panel" id="auth-panel">
      <input type="text" id="login-email" class="auth-input" placeholder="EMAIL">
      <input type="password" id="login-pass" class="auth-input" placeholder="PASS">
      <button class="btn" onclick="cloudLogin('LOGIN')">LOGIN</button>
      <button class="btn" onclick="cloudLogin('REGISTER')">SIGN UP</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="box">
        <div class="box-title">USER STATUS</div>
        <div id="user-info">NOT LOGGED IN</div>
        <div id="sub-count-display" style="font-size:11px; margin-top:4px;"></div>
      </div>

      <div class="box">
        <div class="box-title">SEARCH & FILTER</div>
        <label>Title:</label>
        <input type="text" id="search-input" oninput="applyFilters()">
        
        <label>Category:</label>
        <select id="category-select" onchange="applyFilters()">
          <option value="ALL">ALL CATEGORIES</option>
          <option value="Gaming">Gaming</option>
          <option value="Tech">Tech</option>
          <option value="Animation">Animation</option>
          <option value="Music">Music</option>
        </select>

        <label>Sort By:</label>
        <select id="sort-select" onchange="applyFilters()">
          <option value="TRENDING">Trending (Likes/Time)</option>
          <option value="NEWEST">Newest Uploads</option>
        </select>
      </div>

      <div class="box">
        <div class="box-title">CLOUD UPLOAD</div>
        <label>Title:</label>
        <input type="text" id="upload-title">
        
        <label>Category:</label>
        <select id="upload-category">
          <option value="Gaming">Gaming</option>
          <option value="Tech">Tech</option>
          <option value="Animation">Animation</option>
          <option value="Music">Music</option>
        </select>

        <label>Video File (MP4/WebM):</label>
        <input type="file" id="upload-file" accept="video/mp4,video/webm">
        
        <button class="btn" style="width:100%; margin-top:6px;" onclick="uploadToCloudServer()">UPLOAD TO CLOUD</button>
      </div>
    </div>

    <div class="main-content">
      <div class="channel-banner" id="channel-banner">
        <div><strong>CHANNEL:</strong> <span id="banner-channel-name">SELECT A VIDEO</span></div>
        <div><strong>SUBSCRIBERS:</strong> <span id="banner-sub-count">0</span> <button class="btn" id="sub-btn" onclick="toggleSubscribe()" style="margin-left:6px; display:none;">SUBSCRIBE</button></div>
      </div>

      <div class="box">
        <div class="box-title" id="current-video-title">PLAYER: NO MEDIA LOADED</div>
        <div class="video-player-container" id="player-container">
          <span id="player-placeholder">NO VIDEOS FOUND</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span id="player-category" class="btn" style="font-size:10px;">CAT: NONE</span>
            <span id="player-author" style="margin-left:8px;">By: N/A</span>
          </div>
          <div>
            <button class="btn" onclick="likeVideoOnCloud()">LIKE (<span id="player-likes">0</span>)</button>
          </div>
        </div>
        <div class="share-link" id="share-link-box">DIRECT LINK: N/A</div>
      </div>

      <div class="box">
        <div class="box-title">GLOBAL VIDEO INDEX</div>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">STATUS: HARD RESET PERFORMED. CONNECTING TO CLOUD SERVER...</div>
</div>

<script>
  // Hard wipe local storage completely to erase old local archives
  localStorage.clear();

  // Supabase Cloud Configuration (Free Tier Server Backend)
  const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-PUBLIC-ANON-KEY";
  
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let activeVideo = null;
  let videoDatabase = [];

  window.onload = function() {
    checkCloudSession();
    fetchCloudVideos();
    handleURLRouting();
  };

  window.onpopstate = function() {
    handleURLRouting();
  };

  function handleURLRouting() {
    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watchid');

    if (watchId && videoDatabase.length > 0) {
      const targetVideo = videoDatabase.find(v => v.id == watchId);
      if (targetVideo) {
        loadVideoIntoPlayer(targetVideo, false);
      }
    }
  }

  function goHome() {
    const baseURL = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.pushState({ path: baseURL }, '', baseURL);
    applyFilters();
  }

  async function checkCloudSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      updateUserUI();
    }
  }

  async function cloudLogin(type) {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value.trim();

    if (!email || !pass) {
      alert("PROVIDE EMAIL AND PASSWORD.");
      return;
    }

    if (type === 'REGISTER') {
      const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
      if (error) {
        alert("REGISTRATION ERROR: " + error.message);
      } else {
        alert("SUCCESS! CHECK YOUR EMAIL OR CONFIRMATION.");
        updateStatus("REGISTERED ACCOUNT.");
      }
    } else if (type === 'LOGIN') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) {
        alert("LOGIN ERROR: " + error.message);
      } else {
        currentUser = data.user;
        updateUserUI();
        updateStatus("LOGGED IN AS " + currentUser.email);
      }
    }
  }

  function updateUserUI() {
    document.getElementById('user-info').innerText = currentUser.email.toUpperCase();
    document.getElementById('auth-panel').innerHTML = `<button class="btn" onclick="cloudLogout()">LOGOUT</button>`;
  }

  async function cloudLogout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    window.location.reload();
  }

  async function fetchCloudVideos() {
    updateStatus("FETCHING VIDEOS FROM CLOUD SERVER...");
    const { data, error } = await supabaseClient
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      updateStatus("CLOUD ERROR: " + error.message);
      videoDatabase = [];
    } else {
      videoDatabase = data || [];
      updateStatus("LOADED " + videoDatabase.length + " VIDEOS FROM CLOUD SERVER.");
    }
    applyFilters();
  }

  async function uploadToCloudServer() {
    if (!currentUser) {
      alert("MUST LOGIN TO UPLOAD TO THE CLOUD.");
      return;
    }

    const titleInput = document.getElementById('upload-title').value.trim();
    const categoryInput = document.getElementById('upload-category').value;
    const fileInput = document.getElementById('upload-file');
    const file = fileInput.files[0];

    if (!titleInput || !file) {
      alert("PROVIDE A TITLE AND VIDEO FILE.");
      return;
    }

    updateStatus("UPLOADING VIDEO FILE TO CLOUD STORAGE...");
    const filePath = `uploads/${Date.now()}_${file.name}`;

    // 1. Upload video file to Supabase Cloud Storage bucket
    const { data: storageData, error: storageError } = await supabaseClient.storage
      .from('cloud-videos')
      .upload(filePath, file);

    if (storageError) {
      alert("STORAGE UPLOAD FAILED: " + storageError.message);
      updateStatus("UPLOAD FAILED.");
      return;
    }

    // 2. Get Public URL from Cloud
    const { data: publicUrlData } = supabaseClient.storage
      .from('cloud-videos')
      .getPublicUrl(filePath);

    const videoUrl = publicUrlData.publicUrl;

    updateStatus("SAVING METADATA TO CLOUD DATABASE...");

    // 3. Save Record to Cloud Database table
    const { data: dbData, error: dbError } = await supabaseClient
      .from('videos')
      .insert([
        {
          title: titleInput,
          category: categoryInput,
          video_url: videoUrl,
          author_email: currentUser.email,
          likes: 0
        }
      ])
      .select();

    if (dbError) {
      alert("DATABASE SAVE FAILED: " + dbError.message);
      updateStatus("DATABASE ERROR.");
    } else {
      updateStatus("SUCCESSFULLY PUBLISHED TO GLOBAL CLOUD.");
      fetchCloudVideos();
    }
  }

  function applyFilters() {
    const searchVal = document.getElementById('search-input').value.toLowerCase();
    const catVal = document.getElementById('category-select').value;
    const sortVal = document.getElementById('sort-select').value;

    let filtered = videoDatabase.filter(v => {
      const matchSearch = v.title.toLowerCase().includes(searchVal);
      const matchCat = (catVal === 'ALL') || (v.category === catVal);
      return matchSearch && matchCat;
    });

    if (sortVal === 'TRENDING') {
      filtered.sort((a, b) => {
        const timeA = new Date(a.created_at).getTime();
        const timeB = new Date(b.created_at).getTime();
        const ageA = (Date.now() - timeA) / 3600000 + 2;
        const ageB = (Date.now() - timeB) / 3600000 + 2;
        const scoreA = a.likes / Math.pow(ageA, 1.5);
        const scoreB = b.likes / Math.pow(ageB, 1.5);
        return scoreB - scoreA;
      });
    } else if (sortVal === 'NEWEST') {
      filtered.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
    }

    renderGrid(filtered);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watchid');

    if (!watchId && filtered.length > 0) {
      if (!activeVideo || !filtered.some(v => v.id == activeVideo.id)) {
        loadVideoIntoPlayer(filtered[0], false);
      }
    } else if (filtered.length === 0) {
      resetPlayer();
    }
  }

  function renderGrid(videos) {
    const grid = document.getElementById('video-grid');
    grid.innerHTML = '';

    if (videos.length === 0) {
      grid.innerHTML = `<div class="no-videos-message">NO VIDEOS ON CLOUD SERVER YET</div>`;
      return;
    }

    videos.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => loadVideoIntoPlayer(v, true);

      card.innerHTML = `
        <div class="video-thumb">${v.category.toUpperCase()}</div>
        <div style="font-weight:bold; margin-top:4px;">${v.title}</div>
        <div class="meta">By: ${v.author_email}</div>
        <div class="meta">Likes: ${v.likes} | ${new Date(v.created_at).toLocaleDateString()}</div>
      `;
      grid.appendChild(card);
    });
  }

  function loadVideoIntoPlayer(video, updateURL) {
    activeVideo = video;
    document.getElementById('current-video-title').innerText = "PLAYER: " + video.title.toUpperCase();
    document.getElementById('player-category').innerText = "CAT: " + video.category.toUpperCase();
    document.getElementById('player-author').innerText = "By: " + video.author_email;
    document.getElementById('player-likes').innerText = video.likes;

    document.getElementById('banner-channel-name').innerText = video.author_email;
    document.getElementById('banner-sub-count').innerText = "Public Cloud";

    const directURL = window.location.protocol + "//" + window.location.host + window.location.pathname + "?watchid=" + video.id;
    document.getElementById('share-link-box').innerText = "DIRECT LINK (SHAREABLE): " + directURL;

    if (updateURL) {
      window.history.pushState({ path: directURL }, '', directURL);
    }

    const container = document.getElementById('player-container');
    container.innerHTML = `<video id="main-player" controls preload="metadata"><source src="${video.video_url}" type="video/mp4">Your browser does not support HTML5 video.</video>`;

    updateStatus("LOADED VIDEO FROM CLOUD: " + video.title);
  }

  function resetPlayer() {
    activeVideo = null;
    document.getElementById('current-video-title').innerText = "PLAYER: NO MEDIA LOADED";
    document.getElementById('player-category').innerText = "CAT: NONE";
    document.getElementById('player-author').innerText = "By: N/A";
    document.getElementById('player-likes').innerText = "0";
    document.getElementById('banner-channel-name').innerText = "SELECT A VIDEO";
    document.getElementById('share-link-box').innerText = "DIRECT LINK: N/A";

    const container = document.getElementById('player-container');
    container.innerHTML = `<span id="player-placeholder">NO VIDEOS FOUND</span>`;
  }

  async function likeVideoOnCloud() {
    if (!activeVideo) return;
    if (!currentUser) {
      alert("MUST LOGIN TO LIKE VIDEOS.");
      return;
    }

    const newLikes = activeVideo.likes + 1;
    const { error } = await supabaseClient
      .from('videos')
      .update({ likes: newLikes })
      .eq('id', activeVideo.id);

    if (error) {
      alert("LIKE ERROR: " + error.message);
    } else {
      activeVideo.likes = newLikes;
      document.getElementById('player-likes').innerText = activeVideo.likes;
      updateStatus("LIKE REGISTERED ON CLOUD.");
      fetchCloudVideos();
    }
  }

  function updateStatus(msg) {
    document.getElementById('status-bar').innerText = "STATUS: " + msg;
  }
</script>
</body>
</html>
